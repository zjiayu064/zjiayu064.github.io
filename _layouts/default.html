---
layout: compress
---

<!doctype html>
<html lang="en" class="no-js">
  <head>
    {% include head.html %}
    {% include head/custom.html %}
  </head>

  <body>
    {% include browser-upgrade.html %}

    <div class="site-shell">
      <aside class="site-rail">
        <div class="site-rail__inner">
          {% include site-navigation.html %}
        </div>
      </aside>

      <main id="main" class="site-main" role="main">
        <article class="content-page" itemscope itemtype="https://schema.org/CreativeWork">
          {% if page.title %}<meta itemprop="headline" content="{{ page.title | markdownify | strip_html | strip_newlines | escape_once }}">{% endif %}

          {% if page.show_profile %}
            {% include profile-intro.html %}
          {% endif %}

          <section class="page-content" itemprop="text">
            {{ content }}
          </section>
        </article>
      </main>
    </div>

    {% include scripts.html %}
  </body>
</html>
